<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,600;0,700;1,600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="__bolan_header_reset">
  body{margin:0;}
  a{text-decoration:none;}
</style>
</helmet>
<div style="font-family:'Source Sans 3',sans-serif;position:relative;z-index:100;">
  <div style="background:oklch(19% 0.03 250);color:oklch(78% 0.015 250);display:flex;justify-content:center;align-items:center;gap:10px;padding:8px 20px;font-size:13.5px;font-weight:500;letter-spacing:0.02em;text-align:center;">
    <span>Grays Harbor · Thurston · Mason · Lewis Counties, WA</span>
    <span style="opacity:0.5;">|</span>
    <span>24-Hour Emergency Service — Closed Saturdays</span>
  </div>
  <div style="background:oklch(97% 0.01 75);border-bottom:1px solid oklch(86% 0.012 75);display:flex;align-items:center;justify-content:space-between;padding:16px clamp(20px,4vw,48px);gap:16px;">
    <a href="Home.dc.html" style="display:flex;align-items:center;">
      <img src="uploads/logo.png" alt="Bolan Septic" style="height:clamp(36px,4.2vw,48px);width:auto;" />
    </a>

    <sc-if value="{{ !isMobile }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:clamp(16px,2.2vw,34px);">
        <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="6">
          <a href="{{ item.href }}" style="font-weight:600;font-size:15.5px;color:{{ item.color }};border-bottom:2px solid {{ item.underline }};padding-bottom:5px;">{{ item.label }}</a>
        </sc-for>
      </nav>
    </sc-if>

    <sc-if value="{{ !isMobile }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:center;gap:16px;flex-shrink:0;">
        <a href="tel:+13609560134" style="font-family:'Source Serif 4',serif;font-weight:700;font-size:19px;color:oklch(19% 0.03 250);white-space:nowrap;">(360) 956-0134</a>
        <a href="Contact.dc.html" style="background:oklch(55% 0.13 40);color:oklch(99% 0.005 80);font-weight:700;font-size:14.5px;padding:12px 20px;border-radius:3px;white-space:nowrap;letter-spacing:0.01em;">Request Service</a>
      </div>
    </sc-if>

    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:10px;">
        <a href="tel:+13609560134" aria-label="Call Bolan Septic" style="display:flex;align-items:center;justify-content:center;height:44px;padding:0 16px;border-radius:3px;background:oklch(19% 0.03 250);color:oklch(99% 0.005 80);font-weight:700;font-size:14.5px;">Call</a>
        <button onClick="{{ toggleMenu }}" aria-label="Menu" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:3px;background:transparent;border:1px solid oklch(80% 0.012 75);font-size:20px;color:oklch(19% 0.03 250);">{{ menuIcon }}</button>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{ mobileMenuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;top:0;background:oklch(97% 0.01 75);z-index:200;display:flex;flex-direction:column;padding:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;">
        <img src="uploads/logo.png" alt="Bolan Septic" style="height:38px;width:auto;" />
        <button onClick="{{ toggleMenu }}" aria-label="Close menu" style="width:44px;height:44px;border-radius:3px;background:transparent;border:1px solid oklch(80% 0.012 75);font-size:20px;">✕</button>
      </div>
      <nav style="display:flex;flex-direction:column;gap:0;">
        <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="6">
          <a href="{{ item.href }}" onClick="{{ closeMenu }}" style="font-family:'Source Serif 4',serif;font-weight:600;font-size:26px;color:{{ item.color }};padding:16px 4px;border-bottom:1px solid oklch(88% 0.012 75);">{{ item.label }}</a>
        </sc-for>
      </nav>
      <div style="margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:20px;">
        <a href="tel:+13609560134" style="text-align:center;background:oklch(19% 0.03 250);color:oklch(99% 0.005 80);font-weight:700;font-size:17px;padding:16px;border-radius:3px;">Call (360) 956-0134</a>
        <a href="Contact.dc.html" onClick="{{ closeMenu }}" style="text-align:center;background:oklch(55% 0.13 40);color:oklch(99% 0.005 80);font-weight:700;font-size:17px;padding:16px;border-radius:3px;">Request Service</a>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;bottom:0;left:0;right:0;z-index:150;display:flex;box-shadow:0 -2px 12px oklch(15% 0.01 250 / 0.2);">
      <a href="tel:+13609560134" style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:oklch(19% 0.03 250);color:oklch(99% 0.005 80);font-weight:700;font-size:16px;padding:16px 8px;">Call Now</a>
      <a href="Contact.dc.html" style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:oklch(55% 0.13 40);color:oklch(99% 0.005 80);font-weight:700;font-size:16px;padding:16px 8px;">Request Service</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;activePage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;services&quot;,&quot;areas&quot;,&quot;about&quot;,&quot;reviews&quot;,&quot;contact&quot;]}}">
class Component extends DCLogic {
  state = { isMobile: typeof window !== 'undefined' ? window.innerWidth < 960 : false, mobileMenuOpen: false };

  componentDidMount() {
    this._onResize = () => this.setState({ isMobile: window.innerWidth < 960 });
    window.addEventListener('resize', this._onResize);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
  }

  renderVals() {
    const active = this.props.activePage ?? 'home';
    const ink = 'oklch(19% 0.03 250)';
    const copper = 'oklch(55% 0.13 40)';
    const raw = [
      ['home', 'Home', 'Home.dc.html'],
      ['services', 'Services', 'Services.dc.html'],
      ['areas', 'Service Areas', 'Service-Areas.dc.html'],
      ['about', 'About', 'About.dc.html'],
      ['reviews', 'Reviews', 'Reviews.dc.html'],
      ['contact', 'Contact', 'Contact.dc.html'],
    ];
    const navItems = raw.map(([key, label, href]) => ({
      label, href,
      color: active === key ? copper : ink,
      underline: active === key ? copper : 'transparent',
    }));
    return {
      isMobile: this.state.isMobile,
      mobileMenuOpen: this.state.mobileMenuOpen,
      menuIcon: this.state.mobileMenuOpen ? '✕' : '☰',
      toggleMenu: () => this.setState(s => ({ mobileMenuOpen: !s.mobileMenuOpen })),
      closeMenu: () => this.setState({ mobileMenuOpen: false }),
      navItems,
    };
  }
}
</script>
</body>
</html>
